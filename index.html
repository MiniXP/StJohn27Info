<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>On a Clear Day · St. John Private Trip Guide</title>
<style>body{margin:0;background:#f7f3eb;color:#183239;font:16px system-ui,-apple-system,Segoe UI,sans-serif}.loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:2rem}.loading h1{font-family:Georgia,serif;font-weight:500}.loading p{color:#687b7d}</style>
<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
</head>
<body>
<div class="loading"><div><h1>On a Clear Day</h1><p>Loading your St. John trip guide…</p></div></div>
<script>
(async function(){
  try {
    const source = 'https://raw.githubusercontent.com/MiniXP/StJohn27Info/5cc6fd33978f9476d0e33e20cfc9b99dc9a64462/index.html';
    const response = await fetch(source, {cache:'no-store'});
    if (!response.ok) throw new Error('Could not retrieve site payload (' + response.status + ')');
    const wrapper = await response.text();
    const match = wrapper.match(/const b="([A-Za-z0-9+/=]+)"/);
    if (!match) throw new Error('Site payload was not found');
    if (!window.pako) throw new Error('Decompression library did not load');
    const bytes = Uint8Array.from(atob(match[1]), c => c.charCodeAt(0));
    const html = pako.ungzip(bytes, {to:'string'});
    document.open();
    document.write(html);
    document.close();
  } catch (error) {
    console.error('Trip guide loader error:', error);
    document.body.innerHTML = '<main style="max-width:720px;margin:12vh auto;padding:2rem;font:16px system-ui;color:#183239"><h1 style="font-family:Georgia,serif">Unable to load the trip guide</h1><p>' + String(error.message || error) + '</p><p>Please refresh the page. If the problem continues, the site owner can check the browser console for details.</p></main>';
  }
})();
</script>
</body>
</html>
